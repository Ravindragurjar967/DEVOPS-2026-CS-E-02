services:
  prometheus:
    build:
      context: ./monitoring/prometheus
      dockerfile: Dockerfile
    image: eprescription-prometheus:latest
    container_name: eprescription-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - eprescription-network

  grafana:
    build:
      context: ./monitoring/grafana
      dockerfile: Dockerfile
    image: eprescription-grafana:latest
    container_name: eprescription-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/eprescription-overview.json
      - GF_UNIFIED_ALERTING_ENABLED=false
      - GF_ALERTING_ENABLED=false
    depends_on:
      - prometheus
    networks:
      - eprescription-network

networks:
  eprescription-network:
    name: e-prescriptionproject_eprescription-network
    external: true
